{% extends 'main/base.html' %}
{% load static %}

{% block title %}お問い合わせ - 株式会社イルミラ{% endblock %}

{% block content %}
<section class="contact-form-section">
    <div class="contact-container">
        <h1 class="page-title">お問い合わせ</h1>
        <p class="page-subtitle">CONTACT</p>

        <form id="contactForm" method="post" class="contact-form">
            {% csrf_token %}

            <div class="form-group">
                <label>お問い合わせ種別 <span class="required">*</span></label>
                <select name="inquiry_type" required>
                    <option value="">選択してください</option>
                    <option value="サービスについて">サービスについて</option>
                    <option value="取引について">取引について</option>
                    <option value="その他">その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>会社名</label>
                <input type="text" name="company_name" maxlength="50">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>お名前（姓） <span class="required">*</span></label>
                    <input type="text" name="last_name" required maxlength="30">
                </div>
                <div class="form-group">
                    <label>お名前（名） <span class="required">*</span></label>
                    <input type="text" name="first_name" required maxlength="30">
                </div>
            </div>

            <div class="form-group">
                <label>メールアドレス <span class="required">*</span></label>
                <input type="email" name="email" required maxlength="100">
            </div>

            <div class="form-group">
                <label>電話番号</label>
                <input type="tel" name="phone" placeholder="例: 09012345678" maxlength="11" pattern="\d{10,11}" title="数字のみで入力してください（例: 09012345678）">
            </div>

            <div class="form-group">
                <label>お問い合わせ内容 <span class="required">*</span></label>
                <textarea name="message" rows="8" required maxlength="2000"></textarea>
            </div>

            <!-- reCAPTCHA トークン格納用 -->
            <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response">

            <div class="form-actions">
                <button type="submit" class="btn-submit">送信する</button>
            </div>
        </form>
    </div>
</section>

<!-- reCAPTCHA スクリプト -->
<script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("contactForm");

    // 電話番号は数字のみ
    const phoneField = form.querySelector('input[name="phone"]');
    phoneField.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
    });

    // フォーム送信時バリデーション
    form.addEventListener("submit", function(e) {
        const requiredFields = form.querySelectorAll('[required]');
        let isValid = true;

        requiredFields.forEach(field => {
            if (!field.value.trim()) {
                isValid = false;
                field.style.borderColor = '#e74c3c';
                setTimeout(() => field.style.borderColor = '#e0e0e0', 2000);
            }
        });

        if (!isValid) {
            e.preventDefault();
            alert('必須項目を全て入力してください。');
            return;
        }

        // reCAPTCHA
        e.preventDefault();
        grecaptcha.ready(function() {
            grecaptcha.execute("{{ RECAPTCHA_SITE_KEY }}", {action: "submit"}).then(function(token) {
                document.getElementById("g-recaptcha-response").value = token;
                form.submit();
            });
        });
    });

    // メッセージの自動非表示
    const messages = document.querySelectorAll('.alert');
    messages.forEach(message => {
        setTimeout(() => {
            message.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            message.style.opacity = '0';
            message.style.transform = 'translateY(-20px)';
            setTimeout(() => message.remove(), 500);
        }, 5000);
    });
});
</script>
{% endblock %}
