{% extends 'main/base.html' %}
{% load static %}

{% block title %}お問い合わせ - 株式会社イルミラ{% endblock %}

{% block content %}
<section class="contact-form-section">
    <div class="contact-container">
        <h1 class="page-title">お問い合わせ</h1>
        <p class="page-subtitle">CONTACT</p>
        
        <form method="post" class="contact-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label>お問い合わせ種別 <span class="required">*</span></label>
                <select name="inquiry_type" required>
                    <option value="">選択してください</option>
                    <option value="サービスについて">サービスについて</option>
                    <option value="取引について">取引について</option>
                    <option value="その他">その他</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>会社名</label>
                <input type="text" name="company_name">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>お名前（姓） <span class="required">*</span></label>
                    <input type="text" name="last_name" required>
                </div>
                <div class="form-group">
                    <label>お名前（名） <span class="required">*</span></label>
                    <input type="text" name="first_name" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>メールアドレス <span class="required">*</span></label>
                <input type="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label>電話番号</label>
                <input type="tel" name="phone" placeholder="例: 090-1234-5678">
            </div>
            
            <div class="form-group">
                <label>お問い合わせ内容 <span class="required">*</span></label>
                <textarea name="message" rows="8" required></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-submit">送信する</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
